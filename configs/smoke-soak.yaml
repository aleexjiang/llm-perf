# 10.5 时长制 soak 冒烟：duration_seconds + renew 会话续跑 + 报告侧稳定性区。
# 与其它冒烟配置独立的原因：时长制跑满墙钟（mock 上 ~12s），单独一份便于控制总时长。
endpoint: "http://127.0.0.1:18099/router/v1"
output_dir: "output-smoke-soak"
timeout_seconds: 30
filler_lang: "en"
stream: true
server_metrics: true

models: ["mock-model-a"]

thinking:
  mode: "off"

single:
  runs: 1
  prompt_tokens: [500]
  max_tokens: [32]

multiturn:
  sessions: 1
  turns: 8
  system_tokens: 100
  tool_defs_tokens: 100
  turn_tokens: 200
  max_tokens: 32

concurrent:
  multiturn: true
  levels: [2]            # 2 档（≥2 才进闭环并发场景——level 1 归单发语义不走并发路径）；2 worker 各自会话续跑
  duration_seconds: 12   # 时长制：worker 跑满 12s（mock 上 ~3s/会话 → 重开 2+ 次）
  renew: true            # 会话滚完换新 seed 重开（上下文清零重涨）
  prompt_tokens: 300
  max_tokens: 32
