# 基础冒烟：mock 流式 + 单发/多轮/闭环并发（配 scripts/mock_server.py 用，由 scripts/smoke.sh 自动执行并断言）
# 端点/key 直接写在本文件；环境变量 LLM_PERF_ENDPOINT、LLM_PERF_API_KEY 可覆盖（仅 shell export，工具不读 .env 文件）
#
# 其余变体已独立成文件或由 smoke.sh 临时生成，不再手工改本文件：
#   非流式路径: smoke.sh 生成临时配置（stream: false + thinking mode on）
#   开环到达率: smoke-openloop.yaml
#   全能力回归: smoke-all.yaml；CLI 优先级回归: smoke-overrides.yaml；思考档位: smoke-levels.yaml

endpoint: "http://127.0.0.1:18099/router/v1"
api_key_env: ""
output_dir: "output-smoke"
timeout_seconds: 30
filler_lang: "en"
stream: true
warmup_requests: 1
correctness:
  samples: 1

models: ["mock-model-a", "mock-model-b"]

thinking:
  mode: both
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}
  max_tokens_floor: 2048

multiturn:
  sessions: 1
  turns: 2
  system_tokens: 100
  tool_defs_tokens: 100
  turn_tokens: 200
  max_tokens: 32
  keep_assistant: true

concurrent:
  multiturn: true       # 冒烟并发多轮
  levels: [2]
  runs_per_worker: 1
  prompt_tokens: 300
  max_tokens: 32
