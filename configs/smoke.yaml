# 基础冒烟：mock 流式 + 单发/多轮/闭环并发（配 scripts/mock_server.py 用）
# 端点/key 直接写在本文件；环境变量 LLM_PERF_ENDPOINT、LLM_PERF_API_KEY 可覆盖（仅 shell export，工具不读 .env 文件）
#
# 变体跑法（原独立配置已并入本文件，按需开关）：
#   非流式路径: 把 stream 改 false、thinking.mode 改 on（原 smoke-nostream.yaml）
#   开环到达率: 把 concurrent 段换成——
#     multiturn: false
#     request_rate: 5
#     num_prompts: 6
#     max_concurrency: 2
#   （原 smoke-open.yaml；全能力回归另见 smoke-all.yaml）

endpoint: "http://127.0.0.1:18099/router/v1"
api_key_env: ""
output_dir: "output-smoke"
timeout_seconds: 30
filler_lang: "en"
stream: true

models: ["mock-model-a", "mock-model-b"]

thinking:
  mode: both
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}
  max_tokens_floor: 2048

single:
  runs: 1
  prompt_tokens: [500]
  max_tokens: 64
  fixed_seed: true

multiturn:
  sessions: 1
  turns: 2
  system_tokens: 100
  tool_defs_tokens: 100
  turn_tokens: 200
  max_tokens: 32
  keep_assistant: true

concurrent:
  multiturn: true       # 冒烟并发多轮
  levels: [2]
  runs_per_worker: 1
  prompt_tokens: 300
  max_tokens: 32
