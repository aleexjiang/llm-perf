# 200K 上下文专项：单发多轮 + 并发多轮（Qwen3.8-27B @ 172.17.0.3:8849）
#
# 会话形状：base≈3k(system 1k + tool_defs 2k) + 9轮×25k ≈ 滚到 ~223k（以服务端实测 prompt_tokens 为准）
# 预算核对：~223k prompt + 8192 思考 + 256 content ≈ 232k < max_model_len 262144，余量充足
# 9 轮而非 8 轮：实测每轮净增 ~24.1k（filler 校准偏差+reply），8 轮只到 ~197.7k 不足 200k
# 并发多轮复用 multiturn 段的会话形状（每虚拟用户不同 seed 独立重放），
#   levels [1,2] 对应服务端 --max-num-seqs 2：level1 基线，level2 即真实并行上限，
#   更高档位在 200k 会话下只剩排队放大，不再单测

endpoint: "http://172.17.0.3:8849/v1"
output_dir: "output-200k"
timeout_seconds: 900              # 200k 档 + level2 KV 压力，放宽超时
include_usage: true
filler_lang: "en"
filler_corpus: "en"               # 内置公版书语料，贴近真实 tokenization
stream: true
debug: false

models: ["qwen3.8-27b"]

thinking:
  mode: "both"                    # off/on A/B 对照
  extra_body_on:  {chat_template_kwargs: {enable_thinking: true}}
  extra_body_off: {chat_template_kwargs: {enable_thinking: false}}
  max_tokens_floor: 8192          # Qwen3 对填充文本思考很长，4096 会被吃光

multiturn:
  sessions: 1
  turns: 9
  system_tokens: 1000             # agent system prompt
  tool_defs_tokens: 2000          # tool definitions 持续开销
  turn_tokens: 25000              # 每轮 user 消息，9 轮滚到 ~223k
  max_tokens: 256
  keep_assistant: true

concurrent:
  multiturn: true                 # 并发多轮：每虚拟用户独立跑完整会话重放
  levels: [1, 2]
  runs_per_worker: 1
  prompt_tokens: 1024             # 多轮模式下不使用（会话形状取 multiturn 段）
  max_tokens: 256
