# 降速熔断回归（stall_guard）+ 采样序列落盘（stall_trace），配 scripts/smoke.sh 第 12 节用。
# smoke.sh 会单独起一个 scripts/stall-e2e/mockserver.py 实例（端口 18100，SLOW_TPS=5）：
# 该假服务端按 max_tokens 全量吐 token、每 token 间隔 1/5s——长 prompt（filler ≥80 字符，
# 见 mockserver.py 的 PROMPT_CHARS_THRESHOLD）的流式请求持续 6s+ 低于 min_tps=50 →
# 每个场景都在窗口后熔断中止，用来验证「熔断 → 只中止当前场景 → 冷却 → 续跑下一场景」
# 与 note / stall_trace 留痕。
# 12d 段复用同一 mock 验证单流判据（12.10）：--turns multi --concurrency 8 --stall-tps 20——
# 8 路齐射各 5 tok/s，单流中位 ≈5 < 20（必须触发）、聚合 ≈40 ≥ 20（旧聚合口径不会触发）。
# ⚠️ 档位与阈值耦合：改 filler 的长度口径（chars/token）时必须复核各档位生成的字符数
# 仍 > 阈值——single.prompt_tokens=32 → ≈130 字符、multiturn turn1 ≈346 字符，目前都有裕量。
# （不用主 mock_server.py：它每请求只吐 3 个 content chunk，单请求不足判定窗口，
#   MOCK_TOKEN_DELAY 构造不出「持续低速」现场。）

endpoint: "http://127.0.0.1:18100/v1"
api_key: ""
auth_scheme: "none"
output_dir: "output-smoke-stall"
timeout_seconds: 60
filler_lang: "en"
stream: true
server_metrics: false
seed_salt: 7
warmup_requests: 0

models: ["mock"]

thinking:
  mode: off
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}

stall_guard:
  enabled: true
  min_tps: 50           # 假服务端 5 tok/s → 必然触发
  window_seconds: 2
  cooldown_seconds: 1
  sample_seconds: 0.5
  probe_factor: 0       # 8.2 探针关闭：本配置锁「纯计时冷却、两场景相继熔断续跑」的旧行为；
                        # 探针续跑/停整轮两条路径由 smoke.sh 第 12b/12c 节用 CLI 覆盖验证

multiturn:
  sessions: 1
  turns: 2
  system_tokens: 16
  tool_defs_tokens: 16
  turn_tokens: 16
  max_tokens: 32

concurrent:
  # 单流判据用例（多轮 smoke 以 --turns multi --concurrency 8 --stall-tps 20 调用）：
  # 8 路齐射、每路 5 tok/s → 单流中位 ≈5 < 20 触发；聚合 ≈40 ≥ 20（旧聚合口径不会触发）。
  ramp: false           # 齐射：默认爬坡发车会让并发数上不去，测不出"多流同时劣化"
  runs_per_worker: 1
  prompt_tokens: 32     # ≈130 字符 > mockserver 压测阈值 80（被判为压测请求，走慢速路径）
  max_tokens: [32]      # 32tk @5tok/s = 6.4s > 2s 熔断窗口（sed 改写 max_tokens 时不会误伤此行）
