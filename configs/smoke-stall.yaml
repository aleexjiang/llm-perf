# 降速熔断回归（stall_guard）+ 采样序列落盘（stall_trace），配 scripts/smoke.sh 第 12 节用。
# smoke.sh 会单独起一个 scripts/stall-e2e/mockserver.py 实例（端口 18100，SLOW_TPS=5）：
# 该假服务端按 max_tokens 全量吐 token、每 token 间隔 1/5s——长 prompt（filler ≥200 字符）
# 的流式请求持续 6s+ 低于 min_tps=50 → 每个场景都在窗口后熔断中止，用来验证
# 「熔断 → 只中止当前场景 → 冷却 → 续跑下一场景」与 note / stall_trace 留痕。
# （不用主 mock_server.py：它每请求只吐 3 个 content chunk，单请求不足判定窗口，
#   MOCK_TOKEN_DELAY 构造不出「持续低速」现场。）

endpoint: "http://127.0.0.1:18100/v1"
api_key: ""
auth_scheme: "none"
output_dir: "output-smoke-stall"
timeout_seconds: 60
filler_lang: "en"
stream: true
server_metrics: false
seed_salt: 7
warmup_requests: 0

models: ["mock"]

thinking:
  mode: off
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}

stall_guard:
  enabled: true
  min_tps: 50           # 假服务端 5 tok/s → 必然触发
  window_seconds: 2
  cooldown_seconds: 1
  sample_seconds: 0.5
  probe_factor: 0       # 8.2 探针关闭：本配置锁「纯计时冷却、两场景相继熔断续跑」的旧行为；
                        # 探针续跑/停整轮两条路径由 smoke.sh 第 12b/12c 节用 CLI 覆盖验证

single:
  runs: 1
  prompt_tokens: [32]
  max_tokens: 32
  fixed_seed: true

multiturn:
  sessions: 1
  turns: 2
  system_tokens: 16
  tool_defs_tokens: 16
  turn_tokens: 16
  max_tokens: 32
