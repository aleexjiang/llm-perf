# llm-perf 配置：Qwen3.8-27B 直连 vLLM 实例（客户环境）
#
# 服务端配置要点（docker-compose，vllm/vllm-openai:v0.27.1）：
#   --enable-prefix-caching          前缀缓存已开启 → single fixed_seed 的 Run1 vs Run2 对照有效
#   --max-num-seqs 4                 并发上限（09-05 由 2→4；上一轮实测 KV 占用<4%，瓶颈在调度槽位）
#   --reasoning-parser qwen3         流式响应带 reasoning_content → 思考三段拆分可用
#   --kv-cache-dtype fp8 + MTP 3token 投机解码 → decode 段会明显偏快，属预期
#   --max-model-len 262144           支持到 200k 档
#
# 200K 专项会话形状（原 qwen3.8-27b-200k.yaml，战役已跑完归档 output-200k，配置并入本文件备注）：
#   multiturn: turns 9 × turn_tokens 25000 → base 3k + 滚到 ~223k；预算 223k+8192思考+256输出≈232k < 262144
#   9 轮而非 8 轮：实测每轮净增 ~24.1k（filler 校准偏差+reply），8 轮只到 ~197.7k 不足 200k
#   并发多轮（concurrent.multiturn: true）复用该会话形状，每虚拟用户独立 seed 重放
#
# 端点说明：云上实例，docker-compose 见 deploy/docker-compose.qwen3.8-27b.yml；
#   宿主机上跑 bench → 127.0.0.1:8849；其他机器跑 → <实例IP>:8849

endpoint: "http://<实例IP>:8849/v1"
api_key_env: ""                   # 该实例未启用 API key 校验，留空即不带认证头
output_dir: "output"
timeout_seconds: 600              # 长档位 + max-num-seqs=4 排队，放宽超时
include_usage: true
filler_lang: "en"
filler_corpus: "en"               # 真实文本语料填充（内置公版书），比合成词表更贴近真实 tokenization
stream: true
server_metrics: true              # vLLM 原生 /metrics 已确认可用：缓存命中率/排队/prefill-decode 分解/MTP 接受率
seed_salt: 1                      # 战役盐值：本战役为 max-num-seqs 2→4 调整后的第二轮（上轮数据 output 归档于报告）
warmup_requests: 2                # 每场景前暖连接（不计入统计）
debug: false                      # 换引擎/网关时先改 true 抓原始流量，或直接跑 bench probe

goodput:                          # SLO 约束：TTFT≤2s 且 TPOT≤200ms 才算有效请求
  ttft_ms: 2000
  tpot_ms: 200
correctness:
  samples: 4                      # 数字转写金丝雀，防"HTTP 200 但内容异常"

models:
  - "qwen3.8-27b"

# Qwen3 思考开关：vLLM qwen3 模板走 chat_template_kwargs.enable_thinking
thinking:
  mode: "both"
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}
  max_tokens_floor: 8192   # Qwen3 思考普遍 1500-2500 token；实测 2048 会被吃光（finish=length 无 content），留足余量

# 场景一：单发单轮（fixed_seed 复用同一 prompt，观察前缀缓存命中幅度）
single:
  runs: 3
  prompt_tokens: [4096, 10240, 20480, 40960, 102400, 204800]   # 204800 档：204.8K+8192思考+1024输出≈214K < 262144 上限
  # 输出长度扫描（5.1）：thinking=on 时各档会被 floor(8192) 抬高收敛为单档，扫描只在 thinking=off 侧展开——属预期
  max_tokens: [256, 512, 1024]
  fixed_seed: true

# 场景二：单发多轮（模拟 WorkBuddy agent：system + tool defs + 逐轮滚大的 history）
multiturn:
  sessions: 2
  turns: 8
  system_tokens: 1000
  tool_defs_tokens: 2000
  turn_tokens: 2000
  max_tokens: 256                 # 标量或列表，同 single
  keep_assistant: true

# 场景三：并发。服务端 --max-num-seqs 4：
#   level 1-4 反映真实并行能力，8 反映超订后的排队衰减
concurrent:
  multiturn: false
  levels: [1, 2, 4, 8]
  runs_per_worker: 2
  prompt_tokens: 10240
  max_tokens: 256                 # 标量或列表，同 single（列表会与 levels 相乘，注意总请求量）
