# 5.11 混合档（跨会话 profiles）冒烟：并发多轮按权重分属增量档（SWRR），
# 档位轮数/profile 标签随 JSON 落盘 + 画像逐会话求和。
# 权重 3:1 → 4 会话 = real,real,heavy,real；real 4 轮 / heavy 2 轮；请求量 = 14。
endpoint: "http://127.0.0.1:18099/router/v1"
output_dir: "output-smoke-profiles"
timeout_seconds: 30
filler_lang: "en"
stream: true

models: ["mock-model-a"]

thinking:
  mode: "off"

multiturn:
  turns: 4
  system_tokens: 100
  tool_defs_tokens: 100
  turn_tokens: 200
  max_tokens: 32
  profiles:
    - {weight: 3, name: real, turn_tokens: 100, turns: 4}
    - {weight: 1, name: heavy, turn_tokens: 500, turns: 2}

concurrent:
  multiturn: true
  levels: [4]             # 4 会话（每 worker 1 会话）：SWRR 3:1 → real×3 + heavy×1
  prompt_tokens: 300
  max_tokens: 32
