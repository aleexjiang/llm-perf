# 开环到达率冒烟（原 smoke-open 变体独立成文件，配 scripts/smoke.sh 自动跑）：
# Poisson 到达 + 并发上限 + num_prompts 尊重，断言 RequestRate 落盘与请求总数
endpoint: "http://127.0.0.1:18099/router/v1"
api_key_env: ""
output_dir: "output-smoke-openloop"
timeout_seconds: 30
filler_lang: "en"
stream: true

models: ["mock-model-a"]

thinking:
  mode: "off"
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}

single:
  runs: 1
  prompt_tokens: [500]
  max_tokens: 64
  fixed_seed: true

multiturn:
  sessions: 1
  turns: 2
  system_tokens: 100
  tool_defs_tokens: 100
  turn_tokens: 200
  max_tokens: 32

concurrent:
  multiturn: false
  request_rate: 4          # 到达率 req/s（开环；levels 未配置不生效）
  num_prompts: 6
  max_concurrency: 2
  prompt_tokens: 300
  max_tokens: 32
