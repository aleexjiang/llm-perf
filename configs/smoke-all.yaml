# 全能力冒烟：观测层降级路径 + 预热 + trace 回放 + goodput + 正确性 + 闭环并发
endpoint: "http://127.0.0.1:18099/router/v1"
output_dir: "output-smoke-all"
timeout_seconds: 30
filler_lang: "en"
stream: true
server_metrics: true              # mock 已提供 /metrics → 观测层走真路径（counter 差值/gauge 有数可断言）
warmup_requests: 2
dataset:
  mode: "trace"
  path: "fixtures/trace-sessions.json"   # 相对配置文件目录解析（原 /tmp 绝对路径导致新克隆环境测试必挂）
  format: "sessions"
goodput:
  ttft_ms: 5000
  tpot_ms: 100000
correctness:
  samples: 2

models: ["mock-model-a"]

thinking:
  mode: both
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}
  max_tokens_floor: 512

single:
  runs: 1
  prompt_tokens: [500]
  max_tokens: [32, 64]   # 列表写法冒烟（5.1 输出长度扫描）；thinking=on 时会被 floor(512) 收敛为单档，属预期

multiturn:
  sessions: 1
  turns: 3
  system_tokens: 100
  tool_defs_tokens: 100
  turn_tokens: 200
  max_tokens: 32
  keep_assistant: true

concurrent:
  multiturn: true
  levels: [2]
  runs_per_worker: 1
  prompt_tokens: 300
  max_tokens: 32
