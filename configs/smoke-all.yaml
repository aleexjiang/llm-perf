# 全能力冒烟：观测层降级路径 + 预热 + trace 回放 + goodput + 正确性 + 闭环并发
endpoint: "http://127.0.0.1:18099/router/v1"
output_dir: "output-smoke-all"
timeout_seconds: 30
filler_lang: "en"
stream: true
server_metrics: true              # mock 无 /metrics → 应打印降级告警并继续
warmup_requests: 2
dataset:
  mode: "trace"
  path: "/tmp/trace-sessions.json"
  format: "sessions"
goodput:
  ttft_ms: 5000
  tpot_ms: 100000
correctness:
  samples: 2

models: ["mock-model-a"]

thinking:
  mode: both
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}
  max_tokens_floor: 512

single:
  runs: 1
  prompt_tokens: [500]
  max_tokens: 64

multiturn:
  sessions: 1
  turns: 3
  system_tokens: 100
  tool_defs_tokens: 100
  turn_tokens: 200
  max_tokens: 32
  keep_assistant: true

concurrent:
  multiturn: true
  levels: [2]
  runs_per_worker: 1
  prompt_tokens: 300
  max_tokens: 32
