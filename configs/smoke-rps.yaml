# ── llm-perf smoke：rps 模式（mock server 127.0.0.1:18099）──
endpoint: "http://127.0.0.1:18099/router/v1"
api_key_env: ""
output_dir: "output-smoke-rps"
models: ["mock-model-a"]
thinking:
  mode: "off"
request_set:
  sharegpt_path: "fixtures/sharegpt-mini.json"
  num_prompts: 6
  seed: 42
  max_output_tokens: 64
rps:
  rates: [50]          # 高到达率：6 条请求近乎立即发射
  max_concurrency: 0
