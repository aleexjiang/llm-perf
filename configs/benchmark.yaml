# ── llm-perf 基准预设（benchmark 类别）──
# 必测清单：单流体验 + 容量上限 + 排队-延迟。跑法（两条命令，off/on 由 thinking 自动展开）：
#   bench probe -c configs/benchmark.yaml            # ① 预检标定：min_tps、模型上限、引擎形态
#   bench user -c configs/benchmark.yaml             # ② 真实形状多轮：TTFT 逐轮斜率 + 动态 prefix cache
#   bench concurrency -c configs/benchmark.yaml      # ③ 固定在飞齐射：总吞吐拐点（对齐 vLLM bench serve）
#   bench rps -c configs/benchmark.yaml              # ④ 开环到达：排队-延迟曲线、体验拐点
#
# 基准刻意不写 slo.baseline（各部署各写一把尺子 = 横比失效）；判级阈值见 docs/latency-baselines.md。
# 探索性内容（饱和点细扫、输出长度扫描、混合负载）不在此列，属 performance 类别。

endpoint: "http://<实例IP>:<端口>/router/v1"
api_key: ""                        # 或 api_key_env: "LLM_PERF_API_KEY"
auth_scheme: "bearer"              # bearer | raw（裸 key）| none；配合 auth_header 可用自定义 header
output_dir: "output"
timeout_seconds: 600
corpus_lang: "en"                  # 语料语言：user 模式文本生成用（zh 场景改 zh）
seed_salt: 0                       # 每次战役递增；服务端 prefix cache 未清时重测必须换盐
server_metrics: true
include_usage: true
stream: true
test: "benchmark"                  # 报告结论区切"标准水平"口径；不改测量本身

models:
  - "/models/Qwen3.8-27B"

thinking:
  mode: "both"                     # off 与 on 各跑一遍（思考开销是容量规划系数）
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}

# ② user：agent 形状多轮（首轮 ≥35K；6:3:1 轻/中/重默认比例，可调）
user:
  profile_path: "profiles/agent-v1.json"   # 由 scripts/profile_build.py 从 raw trace 提取
  users: 10                        # 6 轻 + 3 中 + 1 重（权重分派，确定性）
  max_tokens: 256

# ③④ 请求集：冻结快照（与 vLLM bench serve 同源同参才可数字对比）
request_set:
  sharegpt_path: "ShareGPT_V3_unfiltered_cleaned_split.json"
  num_prompts: 1000
  seed: 42
  max_output_tokens: 0             # 0 = 按 ShareGPT assistant 回复长度（vLLM 同口径）

concurrency:
  levels: [1, 2, 4, 8, 16, 32]     # 总吞吐拐点扫描
  request_rate: 0                  # 0 = inf 齐射

rps:
  rates: [1, 2, 4]                 # 体验拐点扫描（围绕 concurrency 拐点吞吐换算的到达率）
  max_concurrency: 64
