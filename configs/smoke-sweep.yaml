# 速率扫描冒烟：开环 rate_sweep 多档 + goodput + 观测层原始数据。
# 与 smoke-openloop.yaml 分开的原因：那份断言「request_rate == 4 且总请求 ≤ num_prompts」
# 的固定档语义，这里要的是多档扫描（吞吐拐点/goodput 上限的交付物形态）。
endpoint: "http://127.0.0.1:18099/router/v1"
api_key_env: ""
output_dir: "output-smoke-sweep"
timeout_seconds: 30
filler_lang: "en"
stream: true
server_metrics: true

models: ["mock-model-a"]

slo:
  goodput:
    ttft_ms: 5000
    tpot_ms: 100000
  baseline:
    long_min_tokens: 300   # 覆盖内置 24000：验证报告按 JSON 透出的阈值判档（500tk 的行落进「大上下文」档）

thinking:
  mode: "off"
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}

multiturn:
  sessions: 1
  turns: 2
  system_tokens: 100
  tool_defs_tokens: 100
  turn_tokens: 200
  max_tokens: 32

concurrent:
  multiturn: true
  rate_sweep: [2, 8]      # 两档到达率：外部分析据此计算容量曲线与 goodput 上限
  num_prompts: 4
  max_concurrency: 2
  prompt_tokens: 300
  max_tokens: 32
