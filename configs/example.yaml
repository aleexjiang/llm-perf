# llm-perf 配置参考（2026-09-18 新架构）
#
# 场景 = 显式子命令，各取所需配置段：
#   bench probe        # 能力与健康探针（引擎/usage/thinking/tool-call/metrics）
#   bench user         # 生成式多轮用户会话（user: 段 + 语料库）
#   bench rps          # 冻结请求快照的开环到达（request_set: + rps: 段）
#   bench concurrency  # 固定在飞齐射（request_set: + concurrency: 段）
#
# filler / 旧 multiturn/concurrent/single 配置已下线（见 docs/workload-refactor-plan.md）。

endpoint: "http://<客户路由IP>:30082/router/v1"
api_key: ""                      # 字面量 key（仅用于不入库的本地配置）；也可改用 api_key_env
auth_scheme: "bearer"            # bearer（默认）| raw（裸 key）| none；auth_header 自定义 header 名
output_dir: "output"
timeout_seconds: 600             # 客户环境慢 + 并发高档位排队，放宽；对 probe 同样生效
chat_path: "/chat/completions"   # 接口路径（默认）
metrics_path: "/metrics"         # 服务端指标路径（默认）
# models_path: "/models"        # probe 用；网关路径不同时改
include_usage: true              # 从 usage 字段取精确 token 数
stream: true                     # 流式开关。false 时 TTFT/ITL/思考拆分 N/A
corpus_lang: "en"                # 语料语言 en/zh：user 模式文本生成 + probe 语料校准共用
seed_salt: 0                     # 测试隔离：重跑/换变体递增，避免命中服务端 prefix cache
server_metrics: true             # 服务端观测层（缓存命中率/排队/prefill-decode 分解）
metrics_interval_ms: 500         # gauge 轮询间隔
debug: false                     # true: 原始响应 → <output_dir>/raw/，日志 → run.log
raw_timings: true                # 原始 chunk 序列落盘（raw_timings）；超长测试可关
max_prompt_tokens: 0             # 上下文截止：user 多轮到顶后停止加轮；0=不限制；--max-ctx 可覆盖
models:
  - "/models/Qwen3.8-27B"        # served name（/models 列表里的 ID）

# ── 思考模式（probe 会自动探测哪个参数可控）──
thinking:
  mode: "both"                   # off/on 各跑一遍（A/B 对照）；levels 配置后取代 mode
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}
  # max_tokens_floor: 2048       # 思考开启时 max_tokens 下限保护；显式 0 = 关闭
  # levels:                      # 自定义思考档位（配后 mode/extra_body 不参与展开）
  #   - {name: low, enabled: true, extra_body: {reasoning_effort: low}}

# ── user 模式：生成式多轮用户会话（bench user）──
# 形状来自 profile.json（scripts/profile_build.py 从 raw trace 提取特征，不含消息文本）；
# 文本由内置 12 本公版书语料按 seed 生成（一用户一书）；assistant 用被测模型真实回复。
user:
  profile_path: "profiles/agent-v1.json"  # 相对配置目录解析
  users: 8                       # 并行用户数（每用户一条完整多轮会话）
  max_tokens: 256                # 输出预算（标量或列表）
  shared_base: true              # 全部用户同一 system 基座（测跨用户共享前缀 cache 收益）

# ── rps / concurrency：冻结请求快照（与 vLLM bench serve 同口径）──
# 请求 = ShareGPT 会话截至最后一条 user 的完整 history；输出预算 = 其后 assistant 估算 token。
# 严格数字对比要求：两边同 sharegpt_path、同 num_prompts、同 seed、同输出预算、同调度参数。
request_set:
  sharegpt_path: "ShareGPT_V3_unfiltered_cleaned_split.json"   # .json / .json.gz
  num_prompts: 1000
  seed: 42
  max_output_tokens: 0           # 单请求输出预算上限（0=不设上限）

rps:
  rates: [1, 2, 4, 8]            # 到达率档位（req/s），多档=排队-延迟曲线扫描
  max_concurrency: 64            # 在飞上限（0=不限；防到达率超容量时无限堆积）
  burstiness: 1                  # 1=泊松；<1 更突发；>1 更均匀

concurrency:
  levels: [1, 2, 4, 8, 16]       # 在飞请求数档位（每档跑满 num_prompts）
  request_rate: 0                # 0=inf 齐射；>0 = 有限到达率 + 在飞上限组合
  burstiness: 1

# ── SLO（可选）：goodput 判定 + 体验基线评估阈值 ──
# slo:
#   goodput: {ttft_ms: 2000, tpot_ms: 100}
#   baseline: {short_max_tokens: 4000, long_min_tokens: 24000}

