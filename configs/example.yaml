# llm-perf 配置示例
# 端点与认证直接写在本文件（endpoint + api_key）；环境变量 LLM_PERF_ENDPOINT、LLM_PERF_API_KEY 优先级更高（应急用；工具不读 .env 文件）

endpoint: "http://<客户路由IP>:30082/router/v1"
api_key: ""                      # 字面量 key，直接写这里（仅用于不入库的本地配置）；也可改用 api_key_env 从环境变量读
auth_scheme: "bearer"            # 认证格式：bearer（默认，Authorization: Bearer <key>）/ raw（裸 key 无 Bearer 前缀，
                                 # 部分网关如此）/ none（免认证端点）；配合 auth_header 可用自定义 header 名
# auth_header: "X-API-Key"       # 自定义认证 header 名（默认 Authorization）；AgentLens 等网关用自定义 header 时配
output_dir: "output"              # 输出 JSON 的默认目录（-o 可覆盖）
timeout_seconds: 600              # 客户环境慢 + 并发高档位排队，放宽（300s 可能不够）；对 bench probe 同样生效
chat_path: "/chat/completions"    # 接口路径（默认 /chat/completions）；客户 router 路径不同时改
metrics_path: "/metrics"          # 服务端指标路径（默认 /metrics）；如挂在 /actuator/prometheus 时改
# models_path: "/models"          # 模型列表路径（默认 /models）；个别网关列表接口路径不同时改（probe 用）
include_usage: true               # 请求 stream_options.include_usage，从 usage 字段取精确 token 数
filler_lang: "en"                 # 填充文本语言：en（约 1 word ≈ 0.75 token）/ zh（约 1 字 ≈ 1 token）
filler_corpus: "en"               # 真实文本语料填充："en"=战争与和平+白鲸记(内置,≈99万token) / "zh"=红楼梦(内置,≈62万token) /
                                  # 文件路径(.txt/.txt.gz)=自定义语料；留空=合成词表。语料比词表更贴近真实 tokenization
max_prompt_tokens: 0              # 上下文截止（tokens）：>0 时所有请求 prompt 不超过该值——single 档位超限截到该值并去重，
                                  # 多轮会话 ctx 到顶后停止加轮；0=不限制。CLI --max-ctx 可覆盖。上限参考 bench probe 的 context_limit
stream: true                      # 流式开关。false 时只能测端到端延迟与 usage，TTFT/ITL/思考拆分 N/A
debug: false                      # true: 原始响应留存 <output_dir>/raw/*.log + 日志写 run.log（排查魔改引擎用；
                                  # 请求失败时即使 false 也会自动转储）。新接引擎建议先跑 bench probe
server_metrics: true              # 服务端观测层：抓推理服务原生 /metrics（vLLM 默认暴露）——前缀缓存命中率、
                                  # 排队深度、prefill/decode 分解、MTP 接受率；不可达时自动降级纯客户端计时
warmup_requests: 0                # 每场景开始前的预热请求数（不计入统计，唯一内容不污染缓存对照）

# 降速熔断 stall_guard（可选，默认关闭；写了即生效）：聚合输出速度持续低于 min_tps 达
# window_seconds 只中止当前场景，已完成数据照常落盘。min_tps 必须按实例稳态 decode
# 速率标定（实测 16.6 tok/s 的实例用默认 20 会在正常运行时误触发）。
# stall_guard:
#   enabled: true
#   min_tps: 20                    # 阈值（tok/s，聚合输出速度），默认 20
#   window_seconds: 600            # 持续低于阈值多久触发，默认 600（10 分钟）
#   cooldown_seconds: 300          # 熔断后到下一场景的冷却，默认 300；只给恢复留时间窗
#   sample_seconds: 2              # 采样周期（秒），默认 2；支持亚秒（回归用 0.5）
#   probe_factor: 2                # 8.2 恢复探针倍数，默认 2：冷却结束发 4k/256×3 短探针取中位，
#                                  #   实测 ≥ probe_factor×min_tps 才继续下一场景，否则停止整轮；
#                                  #   显式 0 = 关闭探针退回纯计时冷却

# 数据源：filler（默认）= token 精确填充，用于缓存对照/上下文深度等变量控制实验；
#         trace = 真实会话回放（ShareGPT/自定义），贴近实际流量分布，token 以服务端 usage 为准
dataset:
  mode: "filler"
  # mode: "trace"
  # path: "ShareGPT_V3_unfiltered_cleaned_split.json"   # .json / .json.gz
  # path: "fixtures/trace-real-16.json.gz"   # 仓库内置真实 agent 会话样本（路径相对配置目录解析）：
                                             # 16 条脱敏 trace，会话峰值 prompt 20k-480k 四档，
                                             # 含 assistant/tool 消息，full 回放真正生效；逐条清单见 fixtures/trace-real-16.md
  # path: "/data/traces/customer-sessions.json.gz"   # 外部文件同样支持：绝对路径直通（客户环境导入的
                                             # trace 放哪都行）；相对路径以配置文件所在目录为基准，
                                             # 与启动时的工作目录解耦
  # format: "sharegpt"       # sharegpt | sessions（自定义 [{"turns":[...]}]；留空自动识别）
  # min_turns: 2             # 会话最少 user 轮数
  # max_sessions: 64         # 最多加载多少会话（0=不限）
  # replay_mode: "full"      # 回放保真度：full（默认，按原序注入全部 role——assistant/tool 消息进上下文，
                             # 测真实 history 深度）| user_only（只回放 user 轮——上下文系统性偏小，
                             # 仅问答类数据集或快速对比用）

# goodput（SLO 约束吞吐）：同时满足以下两条的请求才算有效（concurrent 结果里出 goodput 列）
# goodput:
#   ttft_ms: 2000
#   tpot_ms: 100

# 正确性抽查（防"HTTP 200 但内容异常"的假成功）：数字转写金丝雀，结果进 JSON 与报告数据质量节
# correctness:
#   samples: 8

# 战役盐值：服务端 prefix cache 是内存态且不会被挤出——同一配置重跑时"冷缓存"测量会被
# 上次战役污染。每次测试战役递增盐值（或重启服务端清缓存）。CLI --seed-salt 可覆盖。
# seed_salt: 1

# 连接层重试（默认关闭——压测语义下重试会掩盖服务端不稳定）：只重试瞬时失败
# （TCP/流被 reset、HTTP 5xx/429），4xx 不重试。重试会计入 warnings/retry_count 留痕
# retry:
#   max_attempts: 2     # 总尝试次数
#   backoff_ms: 300     # 退避基数（指数退避，封顶 5s）

# 降速熔断（默认关闭）：长测下服务端退化会白白烧掉几小时——聚合输出速度持续低于阈值
# 就中止**当前场景**（不是整轮），冷却后续跑下一个场景。已完成数据照常落盘，报告的
# note 与 run.log 里标注熔断原因与现场速度。
# 口径：窗口内**所有在飞请求输出 token 之和 / 窗口时长**（非单请求速度——并发下单请求慢
# 可能只是排队）；每个场景独立计时，空闲与纯 prefill（首个 token 之前）不参与判定，
# 避免长上下文档位误触发。速度回升即重置计时（"持续不升"才算降速）。
# CLI 覆盖：--stall-tps / --stall-window / --stall-cooldown；--no-stall-guard 直接关闭。
# stall_guard:
#   enabled: true               # 默认 true（写了该段即生效）
#   min_tps: 20                 # 阈值（tok/s）
#   window_seconds: 600         # 连续低于阈值多久触发（10 分钟）
#   cooldown_seconds: 300       # 触发后到下一个场景的冷却（5 分钟；0 = 立即继续）
#   sample_seconds: 2           # 采样周期；须小于 window_seconds

models:
  - "/models/DeepSeek-V4-Flash-0731"
  - "/models/Qwen3.8-Flash-Next"
  - "/models/Qwen3.8-27B"

# 思考模式：both=每个场景自动跑 off/on 各一遍（A/B 对照）；on / off=只跑其一。
# extra_body 通用透传（对齐 vLLM --extra-body），按实际网关写参数，不同服务示例：
#   vLLM/Qwen:  {chat_template_kwargs: {enable_thinking: true}}
#   其他网关:   {thinking: {type: enabled}} / {enable_thinking: true} 等
thinking:
  mode: "both"
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}
  max_tokens_floor: 8192          # 思考普遍 1500-2500+ token，云上实测 2048 会被吃光（finish=length 无内容）
  # 思考等级（可选）：probe 探测到可控参数后启用；配置 levels 后上面的 mode/extra_body_on/off 失效。
  # 报告与日志按 name 分组，参数名随框架不同（OpenAI reasoning_effort / Qwen thinking_budget / GLM thinking.type）：
  # levels:
  #   - {name: off,  enabled: false, extra_body: {reasoning_effort: "low"}}   # enabled:false = 思考关闭态
  #   - {name: low,  enabled: true,  extra_body: {reasoning_effort: "low"}}
  #   - {name: high, enabled: true,  extra_body: {reasoning_effort: "high"}}
  # CLI 只跑单档：bench -c xxx.yaml --turns single --concurrency 1 --thinking low

# 按模型覆盖思考配置：写到文件底部的 model_overrides.<模型>.thinking（字段级覆盖，
# 只写要改的字段，其余继承全局 thinking）。不同模型/引擎的思考参数与档位词汇不同时用，
# 先对各模型分别跑 probe（bench probe -c xxx.yaml <模型名>）确认可控参数再填。

# 场景一：单发单轮（同 prompt 重复 runs 次，用于观察前缀缓存命中）
single:
  runs: 3
  prompt_tokens: [4000, 10000, 20000, 40000]  # 默认到 40k；需更长上下文自行追加 100000, 200000（若超模型上限该档 400 报错自带上限数字，不影响其他档位）
  # max_tokens 标量或列表（5.1 输出长度扫描）：列表时逐档扫描，报告按输出档分线。
  # 注意 thinking=on 时各档会被 max_tokens_floor 抬高——要扫输出长度需档位 > floor（否则收敛为 floor 单档）
  max_tokens: [256, 512, 1024]
  fixed_seed: true                # true=各 run 用同一 prompt（测缓存）；false=每次换 prompt（测冷启动）

# 场景二：单发多轮（模拟 agent：system + tool defs + 逐轮滚大的 history）
# 形状对齐现代 agent 产品（5.9）：首调上下文 ~35k（system+tool defs 基座 21k × 1.07 模板开销 + 首轮 10k），
# 8 轮滚到末轮 ~108k（128k 模型留 ~12k + 输出预算余量）。
# 起步由 system_tokens + tool_defs_tokens 控制（AgentLens 首调实测中位 ~44k，n=4 偏高但样本不足，
# 暂维持 35k，补样后再定，见 ROADMAP 5.9）；
# probe 确认各模型上限后再微调 turn_tokens / turns。
multiturn:
  sessions: 2                     # 跑几个独立会话
  turns: 8                        # 每个会话几轮
  system_tokens: 18000            # 模拟 agent 的 system 基座（角色指令 + 记忆 + 工作规范）
  tool_defs_tokens: 3000          # 模拟 agent 的 tool definitions 持续开销
  turn_tokens: 10000              # 每轮新增 user 消息：8 轮滚到 ~108k（base 21k + 8×10k）
                                  # 每轮 10k 量级模拟"每轮新增工具结果 + 追问"；多轮滚到 108k ≠ 单条塞 108k，两者推理行为不同
  max_tokens: 256                 # 标量或列表，同 single（多轮列表会与 sessions 相乘，注意总时长）
  keep_assistant: true            # assistant 回复保留进 history（真实 agent 行为）
  max_reply_chars: 2000           # assistant 回复进 history 的截断长度（按字符计，中文安全；默认 2000）

# 场景三：并发（单轮或多轮由 multiturn 决定；闭环 levels 与开环到达率二选一）
concurrent:
  multiturn: false                # false=每用户独立单轮请求；true=每用户各自跑完整多轮会话（filler=模拟对话，trace=真实会话重放）
  levels: [1, 2, 4, 8, 16]        # 闭环并发档位（request_rate/rate_sweep 未配置时生效）
  runs_per_worker: 2              # 单轮模式下每个虚拟用户连续发几次
  prompt_tokens: 10000
  max_tokens: 256                 # 标量或列表，同 single（列表会与 levels 相乘，注意总请求量）
  # 5.7 闭环错峰发车（默认开）：首批发 1 路，等该批全部完成首轮后放下一批
  # min(上批×ramp_factor, 剩余)，批次节奏自适应服务端首轮耗时；任一批次首轮失败即
  # 终止测试（fail-fast），会话内连败 3 轮弃会话、全局连败 ≥2×level 终止（止损）。
  # ramp: false                    # 显式 false 退回 barrier 齐射（所有 worker 同时发车）
  # ramp_factor: 2                 # 批次放大系数，默认 2（可设 3；1 = 逐个串行发车）
  # 开环到达率模式（对齐 vLLM bench serve / inference-perf）：请求按 Poisson 过程到达，
  # 能测出排队-延迟曲线与饱和点；与 levels 互斥，两者都配时 rate_sweep 优先
  # request_rate: 4                # 到达率 req/s
  # rate_sweep: [1, 2, 4, 8, 16]  # 多档扫描（饱和点寻找）
  # num_prompts: 64               # 总请求数（multiturn 时为总会话数），默认 32
  # max_concurrency: 8            # 并发上限（0=不限），防到达率超容量时请求无限堆积
  # 混合负载（5.6）：按权重确定性混跑长短请求（平滑加权轮转，小请求数下低权重形状不饿死）。
  # 线上流量从不均匀——均匀负载测出的吞吐/p99 系统性偏乐观，混跑才能测出容量折扣与真实尾延迟。
  # 与 multiturn: true 互斥；配置后本场景形状由 mix 各项决定，上方 prompt_tokens/max_tokens
  # 单值与 max_tokens 输出扫描失效（配置告警提示）。可与开环 request_rate/rate_sweep 组合，
  # 开环混跑更贴近线上到达模式。报告附形状分解表 + 混跑 vs 均匀对照（<85% 标 ⚠️）。
  # mix:
  #   - {weight: 7, label: short, prompt_tokens: 1000,  max_tokens: 128}
  #   - {weight: 3, label: long,  prompt_tokens: 20000, max_tokens: 1024}

# ─────────────────────────────────────────────────────────────
# 按模型覆盖（可选，配置组织的推荐方式）：顶部通用 + 底部差异
# 键=模型名（必须在 models 列表内，否则配置报错）；只写与通用配置不同的项，
# 未写的键继承顶层（思考覆盖支持字段级：thinking 内只写要改的字段）。
# 多模型战役的数据按模型分区落 <output_dir>/<模型>/<场景>-<ts>.json，重测/作废
# 单模型不纠缠；单模型配置仍直接落 output_dir。
#
# model_overrides:
#   "/models/Qwen3.8-27B":
#     enabled: false                # 本次不测该模型（分批重测时临时关掉；全禁用会报错）
#     max_prompt_tokens: 131072     # 该模型上下文较小：档位提前截止、多轮提前停轮
#     stream: true                  # 引擎能力差异：个别模型不支持流式时关掉
#     thinking:
#       max_tokens_floor: 16384     # 字段级覆盖，mode/extra_body 继承全局
#     single:
#       prompt_tokens: [4000, 10000, 20000]   # 只爬到该模型上下文内
#       runs: 3
#     multiturn:
#       turns: 12
#     concurrent:
#       levels: [1, 4, 16]
#   "/models/DeepSeek-V4-Flash-0731":
#     thinking:
#       levels:
#         - {name: low,  enabled: true,  extra_body: {chat_template_kwargs: {thinking_budget: 1024}}}
#         - {name: high, enabled: true,  extra_body: {chat_template_kwargs: {thinking_budget: 16384}}}
