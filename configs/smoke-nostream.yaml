endpoint: "http://127.0.0.1:18099/router/v1"
api_key_env: ""
output_dir: "output-smoke"
timeout_seconds: 30
filler_lang: "en"
stream: false        # 冒烟非流式路径

models: ["mock-model-a"]

thinking:
  mode: on
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}

single:
  runs: 1
  prompt_tokens: [500]
  max_tokens: 64
  fixed_seed: true

multiturn:
  sessions: 1
  turns: 2
  system_tokens: 100
  tool_defs_tokens: 0
  turn_tokens: 200
  max_tokens: 32
  keep_assistant: true

concurrent:
  levels: [2]
  runs_per_worker: 1
  prompt_tokens: 300
  max_tokens: 32
