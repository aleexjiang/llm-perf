endpoint: "http://127.0.0.1:18850/v1"
api_key: ""
auth_scheme: "none"
output_dir: "/tmp/llm-perf-stall-e2e/out"
timeout_seconds: 120
include_usage: true
filler_lang: "en"
filler_corpus: "en"
stream: true
server_metrics: false
seed_salt: 1
warmup_requests: 0
debug: false

stall_guard:
  enabled: true
  min_tps: 50           # 假服务端长 prompt 只有 5 tok/s → 必然触发
  window_seconds: 3
  cooldown_seconds: 3
  sample_seconds: 1

models:
  - "mock"

thinking:
  mode: "both"
  extra_body_on:
    chat_template_kwargs: {enable_thinking: true}
  extra_body_off:
    chat_template_kwargs: {enable_thinking: false}

single:
  runs: 1
  prompt_tokens: [64]
  max_tokens: 64
  fixed_seed: true

multiturn:
  sessions: 1
  turns: 2
  system_tokens: 16
  tool_defs_tokens: 16
  turn_tokens: 16
  max_tokens: 64

concurrent:
  multiturn: false
  levels: [1]
  runs_per_worker: 1
  prompt_tokens: 64
  max_tokens: 64
